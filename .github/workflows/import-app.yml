name: Publicar aplicativo completo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-app.yml'
      - 'visual-theme.css'
      - 'enhancements.js'
      - 'bootstrap.js'
      - 'student-access.js'
      - 'admin-tools.js'
      - 'provas-v2.js'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'grade-policy.js'
      - 'final-grade-policy.js'
      - 'notes-fix.js'
      - 'emergency-fix.js'
      - 'nav-fix.js'
      - 'student-data-fix.js'
      - 'student-search-fix.js'
      - 'persistence-fix.js'
      - 'recovery-materia-fix.js'
      - 'observacoes-desempenho.js'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar dados auxiliares
        run: |
          curl -L --fail -o app.zip https://github.com/colegio-horizonte/SISTEMADENOTAS/raw/main/Index.zip
          mkdir -p imported
          unzip -o app.zip -d imported >/dev/null
          seed=$(find imported -type f -name 'students-seed.json' | head -n 1)
          logo=$(find imported -type f -name 'logo-colegio.svg' | head -n 1)
          if [ -n "$seed" ]; then cp "$seed" students-seed.json; fi
          if [ -n "$logo" ]; then cp "$logo" logo-colegio.svg; fi
          rm -rf imported app.zip
      - name: Validar aplicativo
        run: |
          set -e
          test -s index.html
          test -s students-seed.json
          test -s visual-theme.css
          test -s bootstrap.js
          test -s student-access.js
          test -s observacoes-desempenho.js
          test -s enhancements.js
          test -s admin-tools.js
          test -s provas-v2.js
          test -s worker.js
          test -s wrangler.jsonc
          test -s grade-policy.js
          test -s final-grade-policy.js
          test -s notes-fix.js
          test -s emergency-fix.js
          test -s nav-fix.js
          test -s student-data-fix.js
          test -s student-search-fix.js
          test -s persistence-fix.js
          test -s recovery-materia-fix.js
          grep -q 'Aurora Mendes' students-seed.json
          grep -q 'Dante Albuquerque' students-seed.json
          grep -q 'Adicionar professor' admin-tools.js
          grep -q 'Adicionar aluno' admin-tools.js
          grep -q '60' provas-v2.js
          grep -q '25' provas-v2.js
          grep -q 'logo-colegio.svg' provas-v2.js
          grep -q 'horizonte-db' wrangler.jsonc
          grep -q '12478dd8-9f46-481e-90dd-8455fdf3ee6d' wrangler.jsonc
          grep -q '"DB"' wrangler.jsonc
          grep -q 'n4' grade-policy.js
          grep -q '2º Bimestre' grade-policy.js
          grep -q 'horizontealuno' student-access.js || grep -q 'Aluno' student-access.js
          grep -q '/api/student' worker.js
          grep -q 'STUDENT_PASS_HASH' worker.js
          grep -q 'Observações e atividades' observacoes-desempenho.js
          grep -q 'Desempenho' observacoes-desempenho.js
          grep -q 'aside{display:flex' visual-theme.css
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html students-seed.json logo-colegio.svg visual-theme.css enhancements.js admin-tools.js bootstrap.js student-access.js observacoes-desempenho.js provas-v2.js worker.js wrangler.jsonc .github/workflows/import-app.yml grade-policy.js final-grade-policy.js notes-fix.js emergency-fix.js nav-fix.js student-data-fix.js student-search-fix.js persistence-fix.js recovery-materia-fix.js
          git diff --cached --quiet || git commit -m 'Corrigir navegação no celular'
          git pull --rebase origin main
          git push origin HEAD:main
