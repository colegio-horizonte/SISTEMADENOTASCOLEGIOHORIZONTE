name: Publicar aplicativo completo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-app.yml'
      - 'enhancements.js'
      - 'bootstrap.js'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar dados auxiliares
        run: |
          curl -L --fail -o app.zip https://github.com/colegio-horizonte/SISTEMADENOTAS/raw/main/Index.zip
          mkdir -p imported
          unzip -o app.zip -d imported >/dev/null
          seed=$(find imported -type f -name 'students-seed.json' | head -n 1)
          logo=$(find imported -type f -name 'logo-colegio.svg' | head -n 1)
          if [ -n "$seed" ]; then cp "$seed" students-seed.json; fi
          if [ -n "$logo" ]; then cp "$logo" logo-colegio.svg; fi
          rm -rf imported app.zip
      - name: Corrigir carregamento das ferramentas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          inject='<script src="/bootstrap.js"></script>'
          if 'src="/bootstrap.js"' not in s:
              pos=s.lower().rfind('</body>')
              if pos<0: raise SystemExit('Tag body não encontrada')
              s=s[:pos]+inject+s[pos:]
          p.write_text(s)
          PY
          test -s index.html
          test -s students-seed.json
          test -s bootstrap.js
          test -s enhancements.js
          test -s admin-tools.js
      - name: Validar aplicativo
        run: |
          grep -q 'Aurora Mendes' students-seed.json
          grep -q 'Dante Albuquerque' students-seed.json
          grep -q 'bootstrap.js' index.html
          grep -q 'Gerar todas as 48 provas' enhancements.js
          grep -q 'Adicionar professor' admin-tools.js
          grep -q 'Adicionar aluno' admin-tools.js
          ! grep -q '4º Bimestre' index.html
          ! grep -q 'Nota 4' index.html
          ! grep -q 'horizonteadmin' index.html
          ! grep -q 'horizonteleticia' index.html
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html students-seed.json logo-colegio.svg enhancements.js admin-tools.js bootstrap.js
          git diff --cached --quiet || git commit -m 'Corrigir acesso a recuperação provas e cadastros'
          git push
