name: Publicar aplicativo completo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-app.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir aplicativo
        run: |
          printf '%s%s%s' '' '' '' > app_payload.b64
          base64 -d app_payload.b64 | gzip -d > index.html
          printf '%s' '' | base64 -d | gzip -d > students-seed.json
          test -s index.html
          test -s students-seed.json
      - name: Validar aplicativo
        run: |
          grep -q 'Aurora Mendes' students-seed.json
          grep -q 'Dante Albuquerque' students-seed.json
          grep -q '3º Bimestre' index.html
          grep -q 'Recuperação' index.html
          grep -q 'Gerar todas as 48 provas' index.html
          grep -q 'Adicionar professor' index.html
          grep -q 'Adicionar aluno' index.html
          ! grep -q '4º Bimestre' index.html
          ! grep -q 'Nota 4' index.html
          ! grep -q 'horizonteadmin' index.html
          ! grep -q 'horizonteleticia' index.html
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html students-seed.json
          git diff --cached --quiet || git commit -m 'Publicar recuperação provas e cadastros'
          git push
